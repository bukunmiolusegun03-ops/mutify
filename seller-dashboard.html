
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mutify Seller Dashboard</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f8f5;
      color: #183326;
    }

    header {
      background: #16834a;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    header a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      max-width: 1000px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 3px 15px #0000000b;
    }

    h2 { margin-top: 0; }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin: 7px 0 14px;
      border: 1px solid #d5e2d9;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      border: 0;
      padding: 11px 17px;
      border-radius: 8px;
      background: #16834a;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button.delete { background: #c0392b; }
    button.secondary { background: #52675a; }

    .product {
      border: 1px solid #e2eae4;
      border-radius: 10px;
      padding: 14px;
      margin: 12px 0;
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .product img {
      width: 75px;
      height: 75px;
      object-fit: cover;
      border-radius: 8px;
      background: #eee;
    }

    .product-info { flex: 1; min-width: 150px; }
    .muted { color: #66776b; }
    #message { margin: 12px 0; font-weight: bold; }
    .hidden { display: none; }

    @media(max-width: 600px) {
      main { margin: 10px auto; }
      .card { padding: 15px; }
    }
  </style>
</head>

<body>

<header>
  <strong>Mutify Seller Centre</strong>
  <a href="index.html">← Back to Mutify</a>
</header>

<main>
  <div id="message">Checking your account...</div>

  <section id="dashboard" class="hidden">

    <div class="card">
      <h2 id="shopName">My Shop</h2>
      <p>Shop status: <strong id="shopStatus">Approved</strong></p>
      <p class="muted">
        Mutify marketplace commission: 10% on successful sales.
      </p>
      <button id="logout" class="secondary">Sign Out</button>
    </div>

    <div class="card">
      <h2 id="formTitle">Add a Product</h2>

      <form id="productForm">
        <label>Product name</label>
        <input id="name" required maxlength="120">

        <label>Description</label>
        <textarea id="description" rows="3"></textarea>

        <label>Price</label>
        <input id="price" type="number" min="0" step="0.01" required>

        <label>Currency</label>
        <select id="currency">
          <option value="NGN">NGN - Naira</option>
          <option value="USD">USD - US Dollar</option>
          <option value="GBP">GBP - British Pound</option>
          <option value="EUR">EUR - Euro</option>
        </select>

        <label>Category</label>
        <input id="category" required maxlength="80"
          placeholder="e.g. Electronics">

        <label>Product image URL (optional)</label>
        <input id="image" type="url"
          placeholder="https://example.com/image.jpg">

        <label>Stock quantity</label>
        <input id="stock" type="number" min="0" step="1"
          value="1" required>

        <button id="saveButton" type="submit">Add Product</button>
        <button id="cancelEdit" type="button"
          class="secondary hidden">Cancel Edit</button>
      </form>
    </div>

    <div class="card">
      <h2>My Products</h2>
      <div id="products">Loading products...</div>
    </div>

  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
(async function () {
  const URL = "https://hyidfjxtzdkkdbpzxqdu.supabase.co";

  // Paste the same complete PUBLIC publishable key used in index.html.
  // Never use a secret or service-role key here.
  const KEY = "publishable_RXdNc8X8RxTKa2IsTq3nFg_2eg6I6rk";

  const db = window.supabase.createClient(URL, KEY);

  const message = document.getElementById("message");
  const dashboard = document.getElementById("dashboard");
  const productsBox = document.getElementById("products");
  const form = document.getElementById("productForm");

  let currentShop = null;
  let editingId = null;

  function say(text) {
    message.textContent = text;
  }

  function safe(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  async function start() {
    const { data: { user }, error } = await db.auth.getUser();

    if (error || !user) {
      say("Please sign in to your Mutify account first.");
      return;
    }

    const { data: approvedShop, error: shopError } = await db
      .from("shops")
      .select("*")
      .eq("owner_id", user.id)
      .eq("status", "approved")
      .limit(1)
      .maybeSingle();

    if (shopError) {
      say("Could not check your shop: " + shopError.message);
      return;
    }

    if (!approvedShop) {
      const { data: application } = await db
        .from("shops")
        .select("status")
        .eq("owner_id", user.id)
        .order("created_at", { ascending: false })
        .limit(1)
        .maybeSingle();

      say(application
        ? "Your shop status is: " + application.status +
          ". Dashboard access requires approval."
        : "You have not submitted a seller application yet.");
      return;
    }

    currentShop = approvedShop;
    document.getElementById("shopName").textContent =
      approvedShop.shop_name;
    document.getElementById("shopStatus").textContent =
      approvedShop.status;

    dashboard.classList.remove("hidden");
    say("");

    await loadProducts();
  }

  async function loadProducts() {
    productsBox.textContent = "Loading products...";

    const { data, error } = await db
      .from("products")
      .select("*")
      .eq("shop_id", currentShop.id)
      .order("created_at", { ascending: false });

    if (error) {
      productsBox.textContent = "Could not load products: " + error.message;
      return;
    }

    if (!data || data.length === 0) {
      productsBox.textContent = "You have not added any products yet.";
      return;
    }

    productsBox.innerHTML = data.map(product => `
      <div class="product">
        ${
          product.image_url
            ? `<img src="${safe(product.image_url)}" alt="">`
            : `<div>No image</div>`
        }
        <div class="product-info">
          <strong>${safe(product.name)}</strong>
          <p>${safe(product.currency)} ${safe(product.price)}</p>
          <p class="muted">
            ${safe(product.category)} · Stock: ${safe(product.stock_quantity)}
          </p>
          <p class="muted">
            ${product.is_active ? "Active" : "Inactive"}
          </p>
        </div>
        <button data-edit="${safe(product.id)}">Edit</button>
        <button class="delete" data-delete="${safe(product.id)}">
          Delete
        </button>
      </div>
    `).join("");

    productsBox.querySelectorAll("[data-edit]").forEach(button => {
      button.addEventListener("click", () => {
        const product = data.find(p => p.id === button.dataset.edit);
        if (product) editProduct(product);
      });
    });

    productsBox.querySelectorAll("[data-delete]").forEach(button => {
      button.addEventListener("click", () => {
        deleteProduct(button.dataset.delete);
      });
    });
  }

  function editProduct(product) {
    editingId = product.id;

    document.getElementById("name").value = product.name || "";
    document.getElementById("description").value =
      product.description || "";
    document.getElementById("price").value = product.price;
    document.getElementById("currency").value =
      product.currency || "NGN";
    document.getElementById("category").value =
      product.category || "";
    document.getElementById("image").value =
      product.image_url || "";
    document.getElementById("stock").value =
      product.stock_quantity;

    document.getElementById("formTitle").textContent = "Edit Product";
    document.getElementById("saveButton").textContent = "Save Changes";
    document.getElementById("cancelEdit").classList.remove("hidden");

    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function resetForm() {
    form.reset();
    editingId = null;

    document.getElementById("formTitle").textContent = "Add a Product";
    document.getElementById("saveButton").textContent = "Add Product";
    document.getElementById("cancelEdit").classList.add("hidden");
  }

  document.getElementById("cancelEdit").addEventListener("click", resetForm);

  form.addEventListener("submit", async event => {
    event.preventDefault();

    const product = {
      name: document.getElementById("name").value.trim(),
      description: document.getElementById("description").value.trim(),
      price: Number(document.getElementById("price").value),
      currency: document.getElementById("currency").value,
      category: document.getElementById("category").value.trim(),
      image_url: document.getElementById("image").value.trim() || null,
      stock_quantity: Number(document.getElementById("stock").value)
    };

    if (!product.name || !product.category ||
        product.price < 0 || product.stock_quantity < 0 ||
        !Number.isInteger(product.stock_quantity)) {
      say("Please check the product details.");
      return;
    }

    say("Saving product...");

    let result;

    if (editingId) {
      result = await db.from("products")
        .update(product)
        .eq("id", editingId)
        .eq("shop_id", currentShop.id);
    } else {
      result = await db.from("products")
        .insert({
          ...product,
          shop_id: currentShop.id
        });
    }

    if (result.error) {
      say("Could not save product: " + result.error.message);
      return;
    }

    say("Product saved successfully!");
    resetForm();
    await loadProducts();
  });

  async function deleteProduct(id) {
    if (!confirm("Are you sure you want to delete this product?")) return;

    say("Deleting product...");

    const { error } = await db.from("products")
      .delete()
      .eq("id", id)
      .eq("shop_id", currentShop.id);

    if (error) {
      say("Could not delete product: " + error.message);
      return;
    }

    say("Product deleted.");
    await loadProducts();
  }

  document.getElementById("logout").addEventListener("click", async () => {
    await db.auth.signOut();
    window.location.href = "index.html";
  });

  await start();
})();
</script>

</body>
</html>
